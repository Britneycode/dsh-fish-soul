# 发版：main 上 package.json 的版本还没有对应的 tag 时，打 v<版本> 并建 GitHub Release。
# 正文取 CHANGELOG.md 里「- v<版本>」那一段（到下一个顶格「- 」为止）。本机的 scripts/release.sh 仍然能用，二选一。
# npm publish 也在这里做：tag 没建过（= 这次是真发版）才发，registry 里已有这个版本时跳过——
# 0.11.3 那次只建了 Release 没发 npm，latest 落后两版，就是漏在这一步。
name: release
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:
# 连推多个版本号提交时旧 run 直接取消（发版步骤幂等，取消安全）
concurrency:
  group: release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 版本号
        id: v
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "tag v$VER 已存在，整个发版流程跳过"
            exit 0
          fi
          # 只在真发版时校验 README；tag 已存在（发版已完成）时跳过，
          # 避免 README 后续改动把已完成的 workflow 标红
          grep -q "版本 \*\*$VER\*\*" README.md || { echo "README 里的版本不是 $VER"; exit 1; }
      - name: 正文
        if: steps.v.outputs.skip != '1'
        run: |
          VER='${{ steps.v.outputs.ver }}'
          awk -v head="- v$VER" '
            index($0, head) == 1 { on = 1; sub(/——$/, ""); print; next }
            on && /^- / { exit }
            on { sub(/^  /, ""); print }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "CHANGELOG 里没找到 - v$VER"; exit 1; }
          cat /tmp/notes.md
      - name: 打 tag + 建 Release
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER='${{ steps.v.outputs.ver }}'
          TITLE="v$VER"
          gh release create "v$VER" --target "$GITHUB_SHA" --title "$TITLE" --notes-file /tmp/notes.md
      - name: npm publish
        # tag 刚建过（这次运行是真的在发版）才发 npm；registry 已有这个版本就跳过（幂等，重跑 workflow 不会重复发）
        if: steps.v.outputs.skip != '1'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER='${{ steps.v.outputs.ver }}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/dsh-fish-soul/$VER")
          if [ "$CODE" = "200" ]; then
            echo "registry 里已有 $VER，跳过 publish"
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺 NPM_TOKEN secret，npm 没发出去（Git 侧已完成，记得手动补 publish）"
            exit 1
          fi
          npm publish --//registry.npmjs.org/:_authToken="$NPM_TOKEN"
      - name: 校验四环
        # 收尾校验：npm latest 要等于本次版本、gitHead 要等于本次提交。registry 同步有快有慢
        # （0.12.0 约 2 分钟，0.13.1 超过 3 分钟才挂 latest），最多等 5 分钟。
        # 轮询从 5s 指数退避到 30s 封顶：同步快时不用白等一个 30s 周期，慢时减少无意义请求。
        if: steps.v.outputs.skip != '1'
        run: |
          VER='${{ steps.v.outputs.ver }}'
          latest() { curl -s "https://registry.npmjs.org/dsh-fish-soul" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))['dist-tags'].latest"; }
          LATEST=$(latest)
          ELAPSED=0; WAIT=5
          while [ "$LATEST" != "$VER" ] && [ $ELAPSED -lt 300 ]; do
            echo "registry latest 还是 $LATEST，等 ${WAIT}s…"
            sleep $WAIT; ELAPSED=$((ELAPSED+WAIT))
            [ $WAIT -lt 30 ] && WAIT=$((WAIT*2))
            [ $WAIT -gt 30 ] && WAIT=30
            LATEST=$(latest)
          done
          if [ "$LATEST" != "$VER" ]; then
            echo "::error::npm latest 还是 $LATEST（等了 ${ELAPSED}s），四环没对齐"
            exit 1
          fi
          HEAD=$(curl -s "https://registry.npmjs.org/dsh-fish-soul/$VER" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).gitHead")
          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "::error::npm 的 gitHead 是 $HEAD，不是本次提交 $GITHUB_SHA"
            exit 1
          fi
          echo "四环对齐：main = tag v$VER = Release = npm $VER ($HEAD)"
