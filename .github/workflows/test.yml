# 测试：每次 push 到 main、每个 PR 都跑 npm test。
# 主套件（smoke + 各专项）在 ubuntu 上能跑；douyin-browser 那套要真 Chromium，ubuntu 上没有就自动跳过（测试文件自己处理）。
# 名字 "test" 会被分支保护规则引用为 status check；改这个名字要同步改 ruleset。
name: test
on:
  push:
    branches: [main]
    # 纯文档改动不跑测试（38 个套件不读任何根 md，已核实）；main 每个代码提交照常全量跑
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    # ⚠️ PR 不能用 paths-ignore：跳过后必需的 "test" check 会一直 pending 卡住合并。
    # 取而代之：job 里 diff 判断，纯文档改动 30 秒内成功退出，check 有结论不卡 PR。
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-test:
    runs-on: ubuntu-latest
    # 只有 PR 允许取消在跑的旧 run（连推时只看最新结果）；push 到 main 永不取消——
    # 每个提交都要完整跑过，失败绝不能被后一个成功提交「盖掉」
    concurrency:
      group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: 判断是否纯文档改动
        if: github.event_name == 'pull_request'
        id: docs
        run: |
          # actions/checkout 默认浅克隆（depth=1，PR 上只有一个 merge commit），
          # 直接 fetch --depth=1 的主干没有共同祖先 → merge-base 必失败。
          # 先补全历史再算 base。
          git fetch --unshallow origin ${{ github.base_ref }} 2>/dev/null || git fetch origin ${{ github.base_ref }}
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          if [ -z "$BASE" ]; then echo "取不到与 ${{ github.base_ref }} 的共同祖先"; exit 1; fi
          # 只看「文档之外」有没有动过文件
          CODE=$(git diff --name-only "$BASE" HEAD -- . ':(exclude)**.md' ':(exclude)docs/**')
          if [ -z "$CODE" ]; then echo "only=1" >> "$GITHUB_OUTPUT"; echo "纯文档改动，跳过测试"; else echo "有代码改动"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 纯文档 PR 也必须过脱敏与版本一致检查（防凭据/uid 借文档改写进公开仓库）
      - name: 安全与版本必跑闸（纯文档 PR 也必须过）
        run: |
          node test/check-secrets.mjs
          node test/check-release-version.mjs

      # 快速闸：语法 + client-lint + 测试链自指，30 秒内出结果。
      # client-lint 挂在 149 个套件中间太靠后了——面板空白这类错误应该第一时间知道。
      - name: 快速闸（语法 + client-lint + 测试链自指）
        if: steps.docs.outputs.only != '1'
        run: |
          for f in lib/*.js lib/channels/*.js; do node --check "$f" || exit 1; done
          node test/client-lint.mjs
          node test/client-syntax.mjs
          node test/check-test-chain.mjs
          node test/check-route-guard.mjs
          node test/check-client-imports.mjs

      # 并行 runner：从 package.json 解析全部套件，并发 4 跑（ubuntu-latest 4 vCPU）
      # 串行 npm test 的命令保留在 package.json，本地照样可用
      #
      # 🔴 douyin-browser 那套要**真启 Chromium**，单独串行跑，不进并行批。
      #    现象：并发 4 时它和 smoke.mjs（88 秒）这类长任务撞在同一批，
      #    Chromium 冷启动超时 → 报「浏览器起来了但 CDP 端口没响应」。
      #    （2026-11-18 实测：并行批里跑了 102.5 秒仍超时，串行跑约 47~53 秒通过。）
      #    FISH_SOUL_CDP_WAIT_MS 放宽到 90 秒没解决 —— 可见不是「等得不够久」，
      #    更像是并发下的资源争用。归因未完全证实，但隔离后已稳定通过。
      #
      # 🔴 **douyin-music 也要摘出来**（2026-11-19 v0.18.14 发版时踩到）。
      #    它同样真启 Chromium，以前放在并行批里「一直没出事」只是因为分批恰好没撞上。
      #    这轮加了 7 个纯逻辑套件（183 个），分批顺序一变，它和长任务挤进同一批 ⇒
      #    `CDP 端口 43009 没响应`，105 秒才挂。
      #    ⇒ **加套件会改变并行调度**：并行批里不该留任何真启浏览器的套件。
      #    判据：本地串行绿 + 本地并行 4 绿 + diff 里没动那个模块 ⇒ 先怀疑调度。
      - run: node test/parallel.mjs 4 --skip "douyin-browser|douyin-music|douyin-video-driver|douyin-wave12-fixes"
        if: steps.docs.outputs.only != '1'
        env:
          FISH_SOUL_CDP_WAIT_MS: '90000'

      - name: 抖音浏览器套件（真启 Chromium，单独跑）
        if: steps.docs.outputs.only != '1'
        run: node test/douyin-browser.mjs
        env:
          FISH_SOUL_CDP_WAIT_MS: '90000'

      - name: 抖音配乐套件（也真启 Chromium，单独跑）
        if: steps.docs.outputs.only != '1'
        run: node test/douyin-music.mjs
        env:
          FISH_SOUL_CDP_WAIT_MS: '90000'

      - name: 抖音视频驱动套件（也真启 Chromium，单独跑）
        if: steps.docs.outputs.only != '1'
        run: node test/douyin-video-driver.mjs
        env:
          FISH_SOUL_CDP_WAIT_MS: '90000'

      - name: 抖音优化与回归套件（也真启 Chromium，单独跑）
        if: steps.docs.outputs.only != '1'
        run: node test/douyin-wave12-fixes.mjs
        env:
          FISH_SOUL_CDP_WAIT_MS: '90000'
