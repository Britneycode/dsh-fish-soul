# 发版：main 上 package.json 的版本还没有对应的 tag 时，打 v<版本> 并建 GitHub Release。
# 正文取 CHANGELOG.md 里「- v<版本>」那一段（到下一个顶格「- 」为止）。本机的 scripts/release.sh 仍然能用，二选一。
# npm publish 也在这里做：tag 没建过（= 这次是真发版）才发，registry 里已有这个版本时跳过——
# 0.11.3 那次只建了 Release 没发 npm，latest 落后两版，就是漏在这一步。
name: release
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:
# 连推多个版本号提交时旧 run 直接取消（发版步骤幂等，取消安全）
concurrency:
  group: release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 版本号
        id: v
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "tag v$VER 已存在，整个发版流程跳过"
            exit 0
          fi
          # 只在真发版时校验 README；tag 已存在（发版已完成）时跳过，
          # 避免 README 后续改动把已完成的 workflow 标红
          grep -q "版本 \*\*$VER\*\*" README.md || { echo "README 里的版本不是 $VER"; exit 1; }
      - name: 正文
        if: steps.v.outputs.skip != '1'
        run: |
          VER='${{ steps.v.outputs.ver }}'
          awk -v head="- v$VER" '
            index($0, head) == 1 { on = 1; sub(/——$/, ""); print; next }
            on && /^- / { exit }
            on { sub(/^  /, ""); print }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "CHANGELOG 里没找到 - v$VER"; exit 1; }
          cat /tmp/notes.md
      - name: 打 tag + 建 Release
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER='${{ steps.v.outputs.ver }}'
          TITLE="v$VER"
          gh release create "v$VER" --target "$GITHUB_SHA" --title "$TITLE" --notes-file /tmp/notes.md
      - name: npm publish
        # tag 刚建过（这次运行是真的在发版）才发 npm；registry 已有这个版本就跳过（幂等，重跑 workflow 不会重复发）
        if: steps.v.outputs.skip != '1'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER='${{ steps.v.outputs.ver }}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://registry.npmjs.org/dsh-fish-soul/$VER")
          if [ "$CODE" = "200" ]; then
            echo "registry 里已有 $VER，跳过 publish"
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺 NPM_TOKEN secret，npm 没发出去（Git 侧已完成，记得手动补 publish）"
            exit 1
          fi
          npm publish --//registry.npmjs.org/:_authToken="$NPM_TOKEN"
      - name: 校验四环
        # 收尾校验：npm latest 要等于本次版本、gitHead 要等于本次提交。
        #
        # 🔴 2026-11-12：这一步连续三次 `free(): invalid next size (normal)` + exit 134
        #    （glibc 堆损坏，本地复现不出来，是 runner 上解析大 JSON 的老毛病）。
        #    病根在拿「整包文档」—— registry.npmjs.org/dsh-fish-soul 那份有 265KB，
        #    每次轮询都要 node 解析一遍、还要经管道过一遍 stdin。
        #
        #    现在逻辑只在 scripts/check-rings.mjs 里维护一份（也方便本地手动跑），
        #    它只用 /latest 端点（约 6KB，一次带 version + gitHead 两个字段），
        #    不落大字符串、不走 curl | node 管道。
        if: steps.v.outputs.skip != '1'
        run: |
          node scripts/check-rings.mjs '${{ steps.v.outputs.ver }}' "$GITHUB_SHA" --wait 300
